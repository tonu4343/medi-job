<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>求人詳細・編集 | Medi Job</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#005bac"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="icon" href="assets/icon-32.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    body.job-detail-page { background: linear-gradient(180deg,#f3f9fd,#fff 55%,#f2faf7); color: var(--ink); }
    .site-header.dash-topbar { position: sticky; top: 0; z-index: 70; }
    .dash-topbar-right { display: flex; align-items: center; gap: 18px; }
    .dash-user { display: flex; align-items: center; gap: 10px; }
    .dash-user-text { text-align: right; line-height: 1.4; }
    .dash-user-text small { display: block; color: var(--muted); font-size: 11px; font-weight: 800; }
    .dash-user-text strong { display: block; color: #14324c; font-size: 13px; font-weight: 900; }
    .dash-logout { min-height: 34px; padding: 0 14px; color: var(--blue); background: #fff; border: 1px solid var(--blue); border-radius: 8px; font-size: 12px; font-weight: 900; cursor: pointer; }

    .dash-body { display: grid; grid-template-columns: 232px 1fr; align-items: start; }
    .dash-sidebar { position: sticky; top: 65px; height: calc(100vh - 65px); overflow-y: auto; padding: 18px 14px 24px; background: #fff; border-right: 1px solid var(--line); }
    .side-nav { display: grid; gap: 3px; margin: 0 0 18px; padding: 0; list-style: none; }
    .side-nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: #3c5266; border-radius: 9px; font-size: 13px; font-weight: 800; transition: background .15s ease, color .15s ease; }
    .side-nav a svg { width: 18px; height: 18px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .side-nav a:hover { background: #f1f7fc; color: var(--blue-dark); }
    .side-nav a.active { color: #fff; background: linear-gradient(120deg, var(--blue), var(--blue-2)); box-shadow: 0 8px 18px rgba(0,91,172,.24); }

    .support-card { margin: 0 2px; padding: 15px; background: #f7fbff; border: 1px solid var(--line); border-radius: 12px; }
    .support-card strong { display: block; color: var(--blue-dark); font-size: 12.5px; font-weight: 900; }
    .support-card span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .support-card .support-phone { margin-top: 8px; color: var(--blue-dark); font-size: 17px; font-weight: 900; }
    .support-card a.support-cta { display: block; margin-top: 10px; text-align: center; min-height: 32px; line-height: 32px; color: var(--blue); background: #fff; border: 1px solid #acd3f1; border-radius: 7px; font-size: 11.5px; font-weight: 900; }

    .detail-shell { min-width: 0; max-width: 1100px; margin: 0 auto; padding: 26px clamp(16px,2.6vw,34px) 60px; }
    .breadcrumb { display: flex; gap: 8px; margin-bottom: 18px; color: var(--muted); font-size: 13px; font-weight: 800; }
    .breadcrumb a { color: var(--blue); }
    .detail-head, .detail-form { background: #fff; border: 1px solid #d3e3ed; border-radius: 14px; box-shadow: 0 16px 38px rgba(0,63,125,.08); }
    .detail-head { display: flex; justify-content: space-between; gap: 24px; align-items: center; padding: clamp(24px,4vw,36px); margin-bottom: 22px; }
    .detail-head h1 { margin: 8px 0 5px; color: var(--blue-dark); font-size: clamp(26px,4vw,38px); font-weight: 900; }
    .detail-head p { margin: 0; color: var(--muted); font-size: 13px; font-weight: 800; }
    .status-badge { display: inline-flex; min-height: 28px; align-items: center; padding: 0 12px; color: var(--green-dark); background: #effff6; border: 1px solid #8bdbad; border-radius: 999px; font-size: 12px; font-weight: 900; }
    .status-badge.closed { color: #657585; background: #f2f5f7; border-color: #ccd6dc; }
    .detail-form { display: none; padding: clamp(24px,4vw,38px); }
    .detail-form.ready { display: block; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 16px; }
    .field { display: grid; gap: 8px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #153e61; font-size: 14px; font-weight: 900; }
    .field input, .field select, .field textarea { width: 100%; padding: 13px 14px; color: #17354d; background: #fff; border: 1px solid #c9d9e4; border-radius: 8px; font: inherit; line-height: 1.6; }
    .field textarea { min-height: 130px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(0,91,172,.1); }
    .detail-actions { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 26px; padding-top: 22px; border-top: 1px solid #e1edf4; }
    .action-group { display: flex; flex-wrap: wrap; gap: 12px; }
    .detail-actions button { cursor: pointer; }
    .btn-danger { color: #b13a32; background: #fff; border: 1px solid #e6aaa5; }
    .page-status { margin: 0 0 18px; padding: 14px 16px; color: #49667d; background: #f3f9fd; border: 1px solid #cfe3f2; border-radius: 9px; font-size: 13px; font-weight: 800; }
    .page-status.success { color: #067044; background: #eafff3; border-color: #a8e4c2; }
    .page-status.error { color: #9d2d24; background: #fff2f0; border-color: #f1bbb5; }
    @media (max-width: 960px) {
      .dash-body { grid-template-columns: 1fr; }
      .dash-sidebar { position: static; height: auto; display: flex; flex-wrap: nowrap; align-items: center; gap: 10px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px; }
      .side-nav { display: flex; gap: 4px; margin: 0; flex: 0 0 auto; }
      .side-nav a { white-space: nowrap; }
      .support-card { display: none; }
    }
    @media (max-width: 680px) { .detail-shell { padding: 20px 14px 48px; } .detail-head { align-items: flex-start; flex-direction: column; } .form-grid { grid-template-columns: 1fr; } .field.full { grid-column: auto; } .detail-actions, .action-group { flex-direction: column; width: 100%; } .detail-actions .btn { width: 100%; } .breadcrumb { flex-wrap: wrap; } }
  </style>
</head>
<body class="job-detail-page employer-dashboard-page">
  <header class="site-header dash-topbar">
    <a class="brand" href="index.html" aria-label="Medi Job ホーム"><span class="brand-mark" aria-hidden="true"><span></span></span><span class="brand-text"><strong>Medical Spot Job</strong><small aria-hidden="true"></small></span></a>
    <div class="dash-topbar-right">
      <div class="dash-user"><div class="dash-user-text"><small id="topbarFacility">読み込み中</small><strong id="topbarContact">-</strong></div></div>
      <button class="dash-logout" id="logoutButton" type="button">ログアウト</button>
    </div>
  </header>

  <div class="dash-body">
    <aside class="dash-sidebar" aria-label="求人者メニュー">
      <ul class="side-nav">
        <li><a href="employer-dashboard.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>ダッシュボード</a></li>
        <li><a class="active" href="employer-jobs.html"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="3" y1="12" x2="21" y2="12"/></svg>求人管理</a></li>
        <li><a href="employer-applications.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15 20c.2-2.3 1.6-4.2 3.5-5"/></svg>応募者管理</a></li>
        <li><a href="employer-messages.html"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg>メッセージ</a></li>
        <li><a href="employer-hires.html"><svg viewBox="0 0 24 24"><path d="M9 12.5l2 2 4-4.5"/><circle cx="12" cy="12" r="9"/></svg>採用管理</a></li>
        <li><a href="employer-profile.html"><svg viewBox="0 0 24 24"><rect x="4" y="8" width="7" height="13"/><rect x="13" y="3" width="7" height="18"/><line x1="6" y1="11" x2="7" y2="11"/><line x1="6" y1="14" x2="7" y2="14"/><line x1="15" y1="7" x2="18" y2="7"/><line x1="15" y1="11" x2="18" y2="11"/></svg>施設情報</a></li>
        <li><a href="employer-payments.html"><svg viewBox="0 0 24 24"><path d="M6 2h9l3 3v17H6z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>料金・お支払い</a></li>
        <li><a href="employer-analytics.html"><svg viewBox="0 0 24 24"><line x1="4" y1="20" x2="20" y2="20"/><rect x="6" y="12" width="3" height="8"/><rect x="11" y="7" width="3" height="13"/><rect x="16" y="3" width="3" height="17"/></svg>分析・レポート</a></li>
        <li><a href="employer-settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>設定</a></li>
        <li><a href="employer-help.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.3 9a2.7 2.7 0 0 1 5.2.9c0 1.8-2.6 2.1-2.6 4.1"/><line x1="12" y1="17.3" x2="12" y2="17.31"/></svg>ヘルプ・お問い合わせ</a></li>
        <li id="adminNavItem" hidden><a href="admin-dashboard.html"><svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-4z"/></svg>管理者画面</a></li>
      </ul>

      <div class="support-card">
        <strong>サポート窓口</strong>
        <span>平日 9:00〜18:00</span>
        <span class="support-phone">03-1234-5678</span>
        <a class="support-cta" href="employer-help.html">お問い合わせ</a>
      </div>
    </aside>

  <main class="detail-shell">
    <div class="breadcrumb"><a href="employer-dashboard.html">求人者マイページ</a><span>›</span><a href="employer-jobs.html">求人管理</a><span>›</span><span>詳細・編集</span></div>
    <section class="detail-head"><div><span class="status-badge" id="statusBadge">読み込み中</span><h1 id="pageTitle">求人情報を読み込んでいます</h1><p>掲載内容の確認・編集・募集状態の変更ができます。</p></div><a class="btn btn-outline" href="employer-jobs.html">求人一覧へ戻る</a></section>
    <div class="page-status" id="pageStatus" role="status" aria-live="polite">求人情報を確認しています…</div>
    <form class="detail-form" id="detailForm">
      <div class="form-grid">
        <div class="field full"><label for="title">求人タイトル</label><input id="title" name="title" required maxlength="80"></div>
        <div class="field"><label for="category">募集職種</label><select id="category" name="category" required><option>看護師</option><option>准看護師</option><option>臨床検査技師</option><option>診療放射線技師</option><option>理学療法士</option><option>作業療法士</option><option>言語聴覚士</option><option>薬剤師</option><option>医療事務</option><option>その他</option></select></div>
        <div class="field"><label for="type">雇用形態</label><select id="type" name="type" required><option>スポット</option><option>非常勤</option><option>パート</option><option>業務委託</option><option>常勤</option></select></div>
        <div class="field full"><label for="salary">給与</label><input id="salary" name="salary" required maxlength="80"></div>
        <div class="field full"><label for="location">勤務地</label><input id="location" name="location" required maxlength="120"></div>
        <div class="field full"><label for="workDate">勤務日・勤務時間</label><input id="workDate" name="work_date" maxlength="120"></div>
        <div class="field full"><label for="description">仕事内容</label><textarea id="description" name="description" required maxlength="2000"></textarea></div>
        <div class="field full"><label for="requirements">応募要件</label><textarea id="requirements" name="requirements" required maxlength="1200"></textarea></div>
      </div>
      <div class="detail-actions"><button class="btn btn-danger" id="toggleStatusButton" type="button">募集を終了する</button><div class="action-group"><a class="btn btn-outline" href="employer-jobs.html">キャンセル</a><button class="btn btn-green" id="saveButton" type="submit">変更を保存</button></div></div>
    </form>
  </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script><script src="account-guard.js"></script>
  <script>
    (function () {
      const config = window.MEDISPOT_SUPABASE || {};
      const configured = config.url && config.anonKey && !config.url.includes("YOUR_PROJECT_ID") && !config.anonKey.includes("YOUR_SUPABASE_ANON_KEY");
      const supabaseClient = configured && window.supabase ? window.supabase.createClient(config.url, config.anonKey) : null;
      const localPreview = location.hostname === "127.0.0.1" || location.hostname === "localhost";
      const jobId = new URLSearchParams(location.search).get("id");
      const form = document.getElementById("detailForm");
      const pageStatus = document.getElementById("pageStatus");
      const statusBadge = document.getElementById("statusBadge");
      const toggleButton = document.getElementById("toggleStatusButton");
      const saveButton = document.getElementById("saveButton");
      let currentUser = null;
      let currentJob = null;
      function message(text, type) { pageStatus.className = "page-status" + (type ? " " + type : ""); pageStatus.textContent = text; }
      function topbar(facility, contact) { document.getElementById("topbarFacility").textContent = facility || "医療機関"; document.getElementById("topbarContact").textContent = (contact || "ご担当者") + " 様"; }
      function fill(job) { currentJob = job; ["title","category","type","salary","location","description","requirements"].forEach(function (key) { if (form.elements[key]) form.elements[key].value = job[key] || ""; }); form.elements.work_date.value = job.work_date || ""; document.getElementById("pageTitle").textContent = job.title || "求人詳細"; const closed = job.status === "closed"; statusBadge.textContent = closed ? "募集終了" : "掲載中"; statusBadge.className = "status-badge" + (closed ? " closed" : ""); toggleButton.textContent = closed ? "募集を再開する" : "募集を終了する"; form.classList.add("ready"); }
      async function load() {
        if (!supabaseClient) { topbar(); if (localPreview) { fill({ title:"スポット看護師募集", category:"看護師", type:"スポット", salary:"日給 18,000円〜22,000円", location:"東京都 新宿区", work_date:"来週金曜 9:00-17:00", description:"外来での看護業務を担当します。", requirements:"看護師免許、臨床経験1年以上", status:"open" }); message("ローカルプレビューです。画面操作を確認できます。", "success"); return; } message("Supabase設定を確認してください。", "error"); return; }
        const sessionResult = await supabaseClient.auth.getSession(); currentUser = sessionResult.data.session?.user;
        if (!currentUser) { topbar(); if (localPreview) { fill({ title:"スポット看護師募集", category:"看護師", type:"スポット", salary:"日給 18,000円〜22,000円", location:"東京都 新宿区", work_date:"来週金曜 9:00-17:00", description:"外来での看護業務を担当します。", requirements:"看護師免許、臨床経験1年以上", status:"open" }); message("ローカルプレビューです。画面操作を確認できます。", "success"); return; } window.location.href = "login.html?role=employer"; return; }
        if (!(await window.MEDISPOT_ACCOUNT_GUARD.check(supabaseClient, currentUser, "employer"))) return;
        const profileResult = await supabaseClient.from("employer_profiles").select("facility_name,contact_name,is_admin").eq("user_id", currentUser.id).order("created_at", { ascending: false }).limit(1).maybeSingle();
        const profile = profileResult.data || {};
        topbar(profile.facility_name, profile.contact_name);
        const adminNavItem = document.getElementById("adminNavItem");
        if (adminNavItem) adminNavItem.hidden = !profile.is_admin;
        if (!jobId) { message("求人IDが指定されていません。求人一覧から選択してください。", "error"); return; }
        const result = await supabaseClient.from("jobs").select("*").eq("id", jobId).eq("employer_id", currentUser.id).maybeSingle();
        if (result.error || !result.data) { console.error(result.error); message("求人を読み込めませんでした。閲覧権限または求人IDをご確認ください。", "error"); return; }
        fill(result.data); message("掲載内容を編集できます。変更後は「変更を保存」を押してください。", "");
      }
      form.addEventListener("submit", async function (event) { event.preventDefault(); if (!form.reportValidity()) return; const data = new FormData(form); const update = { title:data.get("title").trim(), category:data.get("category"), type:data.get("type"), salary:data.get("salary").trim(), location:data.get("location").trim(), work_date:data.get("work_date").trim(), description:data.get("description").trim(), requirements:data.get("requirements").trim() }; if (!supabaseClient || !currentUser) { fill(Object.assign({},currentJob,update)); message("プレビュー上で変更を確認しました。", "success"); return; } saveButton.disabled = true; saveButton.textContent = "保存中…"; const result = await supabaseClient.from("jobs").update(update).eq("id",jobId).eq("employer_id",currentUser.id).select().single(); saveButton.disabled = false; saveButton.textContent = "変更を保存"; if (result.error) { console.error(result.error); message("変更を保存できませんでした。データベース権限をご確認ください。", "error"); return; } fill(result.data); message("求人情報を更新しました。", "success"); });
      toggleButton.addEventListener("click", async function () { const next = currentJob?.status === "closed" ? "open" : "closed"; if (next === "closed" && !window.confirm("この求人の募集を終了しますか？\n終了すると求職者の検索結果に表示されなくなり、新しい応募を受け付けなくなります。")) return; if (!supabaseClient || !currentUser) { fill(Object.assign({},currentJob,{status:next})); message(next === "closed" ? "プレビュー上で募集を終了しました。" : "プレビュー上で募集を再開しました。", "success"); return; } toggleButton.disabled = true; const result = await supabaseClient.from("jobs").update({status:next}).eq("id",jobId).eq("employer_id",currentUser.id).select().single(); toggleButton.disabled = false; if (result.error) { console.error(result.error); message("募集状態を変更できませんでした。", "error"); return; } fill(result.data); message(next === "closed" ? "募集を終了しました。" : "募集を再開しました。", "success"); });
      document.getElementById("logoutButton").addEventListener("click", async function () { if (supabaseClient) await supabaseClient.auth.signOut(); window.location.href = "login.html?role=employer"; });
      load().catch(function (error) { console.error(error); message("求人情報の読み込み中にエラーが発生しました。", "error"); });
    })();
  </script>
<script src="pwa-register.js"></script></body>
