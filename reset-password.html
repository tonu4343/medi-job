<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再設定 | Medi Job</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#005bac"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="icon" href="assets/icon-32.png">
  <style>
    :root {
      --blue: #005bac;
      --blue-dark: #003f7d;
      --green: #21b761;
      --green-dark: #10964d;
      --ink: #08335f;
      --muted: #64798a;
      --line: #d8e8f4;
      --field: #cbdbea;
      --shadow: 0 12px 30px rgba(0, 63, 125, 0.1);
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(180deg, #f3f9ff 0%, #ffffff 44%, #f7fbff 100%);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
      line-height: 1.65;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 16px rgba(0, 63, 125, 0.08);
      backdrop-filter: blur(12px);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      width: min(1180px, calc(100% - 48px));
      min-height: 64px;
      margin: 0 auto;
    }
    .brand { display: inline-flex; align-items: center; gap: 0; color: var(--blue); font-weight: 900; }
    .brand-text { display: flex; flex-direction: column; }
    .brand-mark { position: relative; width: 54px; height: 68px; background-image: url("assets/Blue.png"); background-position: center; background-size: contain; background-repeat: no-repeat; }
    .brand strong { display: block; font-size: 24px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; }
    .page-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 65px);
      padding: 40px 16px;
    }
    .card {
      width: min(420px, 100%);
      padding: 34px 30px;
      background: rgba(255,255,255,0.96);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .card h1 { margin: 0 0 8px; color: var(--blue-dark); font-size: 24px; font-weight: 900; }
    .card .lead { margin: 0 0 22px; color: var(--muted); font-size: 14px; font-weight: 700; }
    .field { margin-bottom: 18px; }
    .field label { display: block; margin-bottom: 8px; color: #061a30; font-size: 15px; font-weight: 900; }
    .field input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      color: #0f2140;
      background: #fff;
      border: 1px solid var(--field);
      border-radius: 8px;
      outline: none;
      font-size: 16px;
      font-weight: 700;
    }
    .field input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(0, 91, 172, 0.1); }
    .notice {
      display: none;
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.7;
    }
    .notice.show { display: block; }
    .submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 54px;
      color: #fff;
      background: linear-gradient(180deg, #0b6fc8, var(--blue));
      border: 0;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(0, 91, 172, 0.2);
    }
    .submit-btn:disabled { opacity: 0.7; cursor: wait; }
    .back-link { display: block; margin-top: 18px; text-align: center; color: var(--blue); font-size: 13px; font-weight: 800; }
    .back-link:hover { text-decoration: underline; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Medi Job ホーム">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span class="brand-text"><strong>Medical Spot Job</strong><small aria-hidden="true"></small></span>
      </a>
    </div>
  </header>

  <main class="page-wrap">
    <section class="card" aria-label="パスワード再設定">
      <h1>パスワード再設定</h1>
      <p class="lead" id="lead">リンクを確認しています…</p>
      <p class="notice" id="notice"></p>
      <form id="resetForm" hidden>
        <div class="field">
          <label for="password">新しいパスワード</label>
          <input id="password" name="password" type="password" placeholder="8文字以上" minlength="8" required>
        </div>
        <div class="field">
          <label for="passwordConfirm">新しいパスワード（確認）</label>
          <input id="passwordConfirm" name="passwordConfirm" type="password" placeholder="もう一度入力" minlength="8" required>
        </div>
        <button class="submit-btn" type="submit">パスワードを更新する</button>
      </form>
      <a class="back-link" href="login.html" id="backLink" hidden>ログイン画面に戻る</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    (function () {
      const config = window.MEDISPOT_SUPABASE || {};
      const configured = config.url && config.anonKey && !config.url.includes("YOUR_PROJECT_ID") && !config.anonKey.includes("YOUR_SUPABASE_ANON_KEY");
      const supabaseClient = configured && window.supabase ? window.supabase.createClient(config.url, config.anonKey) : null;
      const form = document.getElementById("resetForm");
      const notice = document.getElementById("notice");
      const lead = document.getElementById("lead");
      const backLink = document.getElementById("backLink");
      const submitBtn = form.querySelector(".submit-btn");
      let ready = false;

      function showNotice(text, isError) {
        notice.textContent = text;
        notice.classList.add("show");
        notice.style.color = isError ? "#7c2d12" : "#007a52";
        notice.style.background = isError ? "#fff7ed" : "#ecfdf3";
        notice.style.border = "1px solid " + (isError ? "#fed7aa" : "#bbf7d0");
      }

      function showExpiredState() {
        if (ready) return;
        lead.textContent = "このリンクは無効か、有効期限が切れています。";
        showNotice("お手数ですが、パスワード再設定を最初からやり直してください。", true);
        backLink.textContent = "パスワード再設定をやり直す";
        backLink.href = "forgot-password.html";
        backLink.hidden = false;
      }

      function showForm() {
        if (ready) return;
        ready = true;
        lead.textContent = "新しいパスワードを入力してください。";
        form.hidden = false;
      }

      if (!supabaseClient) {
        showNotice("ただいまご利用いただけません。しばらくしてから再度お試しください。", true);
        backLink.hidden = false;
      } else {
        supabaseClient.auth.onAuthStateChange(function (event) {
          if (event === "PASSWORD_RECOVERY") showForm();
        });
        // Some browsers/redirect chains resolve the recovery session before
        // this listener attaches - fall back to checking directly.
        supabaseClient.auth.getSession().then(function (result) {
          if (result.data.session) showForm();
        });
        setTimeout(function () { if (!ready) showExpiredState(); }, 4000);

        form.addEventListener("submit", async function (event) {
          event.preventDefault();
          const password = document.getElementById("password").value;
          const passwordConfirm = document.getElementById("passwordConfirm").value;
          if (password !== passwordConfirm) {
            showNotice("パスワードが一致しません。", true);
            return;
          }
          submitBtn.disabled = true;
          const { error } = await supabaseClient.auth.updateUser({ password: password });
          submitBtn.disabled = false;
          if (error) {
            console.error(error);
            showNotice("パスワードを更新できませんでした。もう一度お試しください。", true);
            return;
          }
          await supabaseClient.auth.signOut();
          form.hidden = true;
          lead.textContent = "パスワードを更新しました。";
          showNotice("新しいパスワードでログインしてください。", false);
          backLink.hidden = false;
        });
      }
    })();
  </script>
<script src="pwa-register.js"></script></body>
</html>
