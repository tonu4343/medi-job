<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>お気に入り | Medi Job</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#005bac"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="icon" href="assets/icon-32.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root { --sj-blue:#1565C0; --sj-blue-dark:#0d47a1; --sj-green:#22C55E; --sj-green-dark:#16A34A; --sj-ink:#101828; --sj-muted:#64748B; --sj-line:#E5EAF1; --sj-radius:18px; }
    body.flow-page { background:#F6F9FC; color:var(--ink); }
    .site-header.seeker-topbar { position: sticky; top: 0; z-index: 70; }
    .seeker-topbar-right { display: flex; align-items: center; gap: 16px; }
    .seeker-user { display: flex; align-items: center; gap: 9px; }
    .seeker-avatar { display: grid; place-items: center; width: 32px; height: 32px; color: #fff; background: var(--blue); border-radius: 50%; font-size: 12px; font-weight: 900; }
    .seeker-user strong { color: #14324c; font-size: 13px; font-weight: 900; }

    .dash-body { display: grid; grid-template-columns: 230px minmax(0, 1fr); align-items: start; width: 100%; min-width: 0; }
    .dash-sidebar { position: sticky; top: 65px; height: calc(100vh - 65px); overflow-y: auto; padding: 18px 14px 24px; background: #fff; border-right: 1px solid var(--line); }
    .side-nav { display: grid; gap: 3px; margin: 0 0 16px; padding: 0; list-style: none; }
    .side-nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: #3c5266; border-radius: 9px; font-size: 13px; font-weight: 800; }
    .side-nav a svg { width: 18px; height: 18px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .side-nav a:hover { background: #f1f7fc; color: var(--blue-dark); }
    .side-nav a.active { color: #fff; background: linear-gradient(120deg, var(--blue), var(--blue-2)); box-shadow: 0 8px 18px rgba(0,91,172,.24); }
    .support-card { padding: 15px; background: #f7fbff; border: 1px solid var(--line); border-radius: 12px; }
    .support-card strong { display: block; color: var(--blue-dark); font-size: 12.5px; font-weight: 900; }
    .support-card span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .support-card .support-phone { margin-top: 8px; color: var(--blue-dark); font-size: 17px; font-weight: 900; }
    .support-card a.support-cta { display: block; margin-top: 10px; text-align: center; min-height: 32px; line-height: 32px; color: var(--blue); background: #fff; border: 1px solid #acd3f1; border-radius: 7px; font-size: 11.5px; font-weight: 900; }

    .flow-shell { width: 100%; min-width: 0; padding: 26px clamp(16px,2.6vw,34px) 60px; }
    .header-actions { display:flex; align-items:center; gap:12px; }
    .logout-btn { min-height:38px; padding:0 18px; color:var(--blue); background:#fff; border:1px solid var(--blue); border-radius:8px; font-size:13px; font-weight:900; cursor:pointer; }

    .sj-page-head { margin-bottom:22px; }
    .sj-page-head h1 { margin:0; color:var(--sj-ink); font-size:clamp(26px,3.2vw,36px); line-height:1.3; font-weight:900; letter-spacing:-.01em; }
    .sj-page-head p { margin:8px 0 0; color:var(--sj-muted); font-size:14.5px; font-weight:700; line-height:1.8; }

    .sj-toolbar { display:flex; justify-content:space-between; gap:16px; align-items:baseline; margin:0 0 16px; }
    .sj-toolbar h2 { margin:0; color:var(--sj-ink); font-size:20px; font-weight:900; }
    .sj-toolbar .sj-count { color:var(--sj-muted); font-size:13.5px; font-weight:800; }
    .sj-jobs-list { display:grid; gap:16px; }

    .sj-job-card { position:relative; display:flex; gap:22px; background:#fff; border:1px solid var(--sj-line); border-radius:var(--sj-radius); box-shadow:0 8px 22px rgba(16,24,40,.06); padding:18px; transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease; }
    .sj-job-card:hover { transform:translateY(-3px); box-shadow:0 20px 40px rgba(16,24,40,.12); border-color:#CFE0F5; }
    .sj-job-card-link { position:absolute; inset:0; z-index:1; border-radius:inherit; }
    .sj-job-card-link:focus-visible { outline:3px solid var(--sj-blue); outline-offset:2px; }
    .sj-job-card-save { position:absolute; top:14px; right:14px; z-index:2; width:34px; height:34px; display:grid; place-items:center; color:#EF4444; background:rgba(255,255,255,.92); border:1px solid #FBD5D5; border-radius:50%; font-size:17px; line-height:1; cursor:pointer; transition:transform .15s; }
    .sj-job-card-save:hover { transform:scale(1.08); }
    .sj-job-card-save:disabled { cursor:default; opacity:.6; }

    .sj-job-card-media { position:relative; flex:0 0 220px; width:220px; height:160px; overflow:hidden; border-radius:14px; background:#EEF3FA; }
    .sj-job-card-media img { width:100%; height:100%; object-fit:cover; }
    .sj-badge-closed { position:absolute; top:10px; left:10px; z-index:2; display:inline-flex; align-items:center; height:22px; padding:0 10px; color:#fff; background:#94A3B8; border-radius:999px; font-size:10.5px; font-weight:900; letter-spacing:.03em; }

    .sj-job-card-body { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
    .sj-job-card-badges { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:9px; }
    .sj-badge { display:inline-flex; align-items:center; height:24px; padding:0 11px; border-radius:999px; font-size:11.5px; font-weight:900; white-space:nowrap; }
    .sj-badge-type { color:var(--sj-green-dark); background:#EAFBF1; border:1px solid #BCEDD1; }

    .sj-job-card-title { margin:0 0 5px; color:var(--sj-ink); font-size:19px; line-height:1.4; font-weight:900; }
    .sj-job-card-facility { margin:0 0 10px; color:var(--sj-muted); font-size:13px; font-weight:700; }
    .sj-job-card-meta { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:auto; }
    .sj-meta-item { display:inline-flex; align-items:center; gap:5px; color:#475569; font-size:12.5px; font-weight:700; }
    .sj-meta-item svg { width:14px; height:14px; stroke:#94A3B8; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }

    .sj-job-card-footer { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:14px; padding-top:14px; border-top:1px dashed var(--sj-line); }
    .sj-job-card-salary { color:var(--sj-green-dark); font-size:16.5px; font-weight:900; }
    .sj-job-card-cta { position:relative; z-index:2; pointer-events:none; padding:0 18px; height:38px; font-size:12.5px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; height:46px; padding:0 22px; border-radius:10px; font-weight:900; font-size:14px; border:0; cursor:pointer; text-decoration:none; white-space:nowrap; }
    .btn-outline { color:var(--sj-blue); background:#fff; border:1.5px solid #C7DAF0; }
    .sj-job-card:hover .sj-job-card-cta { color:#fff; background:var(--sj-blue); border-color:var(--sj-blue); }

    .sj-jobs-empty { padding:48px 24px; text-align:center; color:var(--sj-muted); background:#fff; border:1px dashed var(--sj-line); border-radius:var(--sj-radius); font-size:14px; font-weight:700; }
    .sj-jobs-empty a { color: var(--sj-blue); font-weight: 900; }

    @media (max-width: 960px) {
      .dash-body { grid-template-columns: 1fr; }
      .dash-sidebar { position: static; height: auto; display: flex; flex-wrap: nowrap; align-items: center; gap: 10px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px; }
      .side-nav { display: flex; gap: 4px; margin: 0; flex: 0 0 auto; }
      .side-nav a { white-space: nowrap; }
      .support-card { display: none; }
    }
    @media(max-width:640px){
      .flow-shell{padding:20px 14px 48px}
      .sj-job-card{flex-direction:column}
      .sj-job-card-media{width:100%;height:170px}
      .sj-job-card-footer{flex-direction:column;align-items:flex-start;gap:10px}
      .sj-job-card-cta{width:100%;text-align:center}
    }
  </style></head><body class="flow-page dashboard-page">
  <header class="site-header seeker-topbar">
    <a class="brand" href="index.html" aria-label="Medi Job home"><span class="brand-mark" aria-hidden="true"><span></span></span><span class="brand-text"><strong>Medical Spot Job</strong><small aria-hidden="true"></small></span></a>
    <div class="seeker-topbar-right">
      <div class="seeker-user"><span class="seeker-avatar" id="topbarInitial">求</span><strong id="topbarName">ゲスト</strong></div>
      <button class="logout-btn" id="logoutButton" type="button">ログアウト</button>
    </div>
  </header>

  <div class="dash-body">
    <aside class="dash-sidebar" aria-label="求職者メニュー">
      <ul class="side-nav">
        <li><a href="seeker-dashboard.html"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>ダッシュボード</a></li>
        <li><a href="seeker-jobs.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>求人を探す</a></li>
        <li><a class="active" href="seeker-favorites.html"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.3-9.5-8.7C1 8.3 2.6 5 6 5c2 0 3.3 1.1 4 2.2C10.7 6.1 12 5 14 5c3.4 0 5 3.3 3.5 6.3C19 15.7 12 20 12 20z"/></svg>お気に入り</a></li>
        <li><a href="seeker-applications.html"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>応募管理</a></li>
        <li><a href="seeker-messages.html"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg>メッセージ</a></li>
        <li><a href="seeker-profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>プロフィール</a></li>
        <li><a href="seeker-resume.html"><svg viewBox="0 0 24 24"><path d="M6 2h9l3 3v17H6z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>履歴書・職務経歴書</a></li>
        <li><a href="seeker-notices.html"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>お知らせ</a></li>
        <li><a href="seeker-settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>設定</a></li>
      </ul>

      <div class="support-card">
        <strong>サポート窓口</strong>
        <span>平日 9:00〜18:00</span>
        <span class="support-phone">03-1234-5678</span>
        <a class="support-cta" href="#">お問い合わせ</a>
      </div>
    </aside>

    <main class="flow-shell">
      <div class="sj-page-head"><h1>お気に入りの求人</h1><p>♡で保存した求人をまとめて確認できます。</p></div>
      <div class="sj-toolbar"><h2>保存した求人</h2><span class="sj-count" id="jobCount">0件</span></div>
      <section class="sj-jobs-list" id="favoritesList"></section>
    </main>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="account-guard.js"></script>
<script src="favorites.js"></script>
<script>
  (function () {
    const config = window.MEDISPOT_SUPABASE || {};
    const configured = config.url && config.anonKey && !config.url.includes("YOUR_PROJECT_ID") && !config.anonKey.includes("YOUR_SUPABASE_ANON_KEY");
    const supabaseClient = configured && window.supabase ? window.supabase.createClient(config.url, config.anonKey) : null;
    const pinIcon = '<svg viewBox="0 0 24 24"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/></svg>';
    const clockIcon = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.3 2"/></svg>';
    function esc(v) { return String(v || "").replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]; }); }
    function imageFor(job) { const c = String(job.category || ""); return job.image || (c.includes("検査") ? "assets/job-lab.png" : c.includes("放射") ? "assets/job-radiology.png" : "assets/job-nurse.png"); }
    function formatSalary(value) {
      const trimmed = String(value || "").trim();
      if (!trimmed) return "";
      if (/^[\d,]+$/.test(trimmed)) return "時給" + Number(trimmed.replace(/,/g, "")).toLocaleString("ja-JP") + "円";
      return trimmed;
    }
    function card(job) {
      const title = esc(job.title || job.category || "医療求人");
      const href = "job-detail.html?id=" + encodeURIComponent(job.id);
      const closed = job.status && job.status !== "open";
      return '<article class="sj-job-card">'
        + '<a class="sj-job-card-link" href="' + href + '" aria-label="' + title + '詳細を見る"></a>'
        + '<button class="sj-job-card-save fav-toggle" type="button" data-job-id="' + esc(job.id) + '" aria-label="お気に入りから削除">♥</button>'
        + '<div class="sj-job-card-media"><img src="' + esc(imageFor(job)) + '" alt="">' + (closed ? '<span class="sj-badge-closed">募集終了</span>' : '') + '</div>'
        + '<div class="sj-job-card-body">'
          + '<div class="sj-job-card-badges"><span class="sj-badge sj-badge-type">' + esc(job.type || "スポット") + '</span></div>'
          + '<h3 class="sj-job-card-title">' + title + '</h3>'
          + '<p class="sj-job-card-facility">' + esc(job.facility_name || "医療機関") + '</p>'
          + '<div class="sj-job-card-meta">'
            + '<span class="sj-meta-item">' + pinIcon + esc(job.location || "-") + '</span>'
            + '<span class="sj-meta-item">' + clockIcon + esc(job.work_date || "-") + '</span>'
          + '</div>'
          + '<div class="sj-job-card-footer"><div class="sj-job-card-salary">' + esc(formatSalary(job.salary) || "給与相談") + '</div><span class="btn btn-outline sj-job-card-cta">詳細を見る</span></div>'
        + '</div>'
        + '</article>';
    }
    async function load() {
      if (!supabaseClient) { document.getElementById("favoritesList").innerHTML = '<div class="sj-jobs-empty">お気に入り機能をご利用いただけません。</div>'; return; }
      const session = await supabaseClient.auth.getSession();
      const user = session.data.session?.user;
      if (!user) { window.location.href = "login.html?role=seeker"; return; }
      if (!(await window.MEDISPOT_ACCOUNT_GUARD.check(supabaseClient, user, "seeker"))) return;
      const profileResult = await supabaseClient.from("seeker_profiles").select("name").eq("user_id", user.id).order("created_at", { ascending: false }).limit(1).maybeSingle();
      const name = profileResult.data?.name;
      document.getElementById("topbarName").textContent = name || "求職者";
      document.getElementById("topbarInitial").textContent = (name || "求").trim().charAt(0).toUpperCase() || "求";

      const favoriteIds = await window.MEDISPOT_FAVORITES.fetchFavoriteIds(supabaseClient, user.id);
      const list = document.getElementById("favoritesList");
      const jobIds = Array.from(favoriteIds);
      let jobs = [];
      if (jobIds.length) {
        const jobsResult = await supabaseClient.from("jobs").select("*").in("id", jobIds);
        jobs = jobsResult.error ? [] : (jobsResult.data || []);
      }
      document.getElementById("jobCount").textContent = jobs.length + "件";
      list.innerHTML = jobs.length ? jobs.map(card).join("") : '<div class="sj-jobs-empty">まだお気に入りに追加した求人がありません。<br><a href="seeker-jobs.html">求人を探す</a></div>';
      // Removing a favorite here should drop the card once the removal is
      // actually confirmed, not just when the heart recolors.
      window.MEDISPOT_FAVORITES.wire(list, supabaseClient, user.id, favoriteIds, function (jobId, favorited, btn) {
        if (favorited) return;
        const removedCard = btn.closest(".sj-job-card");
        if (removedCard) removedCard.remove();
        const remaining = list.querySelectorAll(".sj-job-card").length;
        document.getElementById("jobCount").textContent = remaining + "件";
        if (!remaining) list.innerHTML = '<div class="sj-jobs-empty">まだお気に入りに追加した求人がありません。<br><a href="seeker-jobs.html">求人を探す</a></div>';
      });
    }
    document.getElementById("logoutButton").addEventListener("click", async function () { if (supabaseClient) await supabaseClient.auth.signOut(); window.location.href = "login.html?role=seeker"; });
    load().catch(function (error) { console.error(error); });
  })();
</script>
<script src="pwa-register.js"></script></body></html>
